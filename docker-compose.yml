services:

  postgres:
    image: postgres:17
    container_name: digital-asset-vault-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - digital_asset_vault_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - digital-asset-vault

    



  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: digital-asset-vault-backend

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_PORT: 8081

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - digital-asset-vault
      - homelab_internal

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=homelab_internal"
    #   - "traefik.http.routers.digital-asset-vault-api.rule=Host(`api.digital-asset-vault.localhost`)"
    #   - "traefik.http.routers.digital-asset-vault-api.entrypoints=websecure"
    #   - "traefik.http.routers.digital-asset-vault-api.tls=true"
    #   - "traefik.http.services.digital-asset-vault-api.loadbalancer.server.port=8081"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab_internal"
      - "traefik.http.routers.digital-asset-vault-api.rule=Host(`api.digital-asset-vault.mouhamadougaye.com`)"
      - "traefik.http.routers.digital-asset-vault-api.entrypoints=websecure"
      - "traefik.http.routers.digital-asset-vault-api.tls=true"
      - "traefik.http.routers.digital-asset-vault-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.digital-asset-vault-api.loadbalancer.server.port=8081"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.digital-asset-vault.localhost

    container_name: digital-asset-vault-frontend

    expose:
      - "3000"

    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000

    depends_on:
      - backend

    networks:
      - digital-asset-vault
      - homelab_internal

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=homelab_internal"
    #   - "traefik.http.routers.digital-asset-vault.rule=Host(`digital-asset-vault.localhost`)"
    #   - "traefik.http.routers.digital-asset-vault.entrypoints=websecure"
    #   - "traefik.http.routers.digital-asset-vault.tls=true"
    #   - "traefik.http.services.digital-asset-vault.loadbalancer.server.port=3000"
    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=homelab_internal"
    - "traefik.http.routers.digital-asset-vault.rule=Host(`digital-asset-vault.mouhamadougaye.com`)"
    - "traefik.http.routers.digital-asset-vault.entrypoints=websecure"
    - "traefik.http.routers.digital-asset-vault.tls=true"
    - "traefik.http.routers.digital-asset-vault.tls.certresolver=letsencrypt"
    - "traefik.http.services.digital-asset-vault.loadbalancer.server.port=3000"


# networks:
#   digital-asset-vault:
#     driver: bridge
#     name: traefik_internal   # ← le vrai nom, à adapter

networks:
  digital-asset-vault:
    driver: bridge

  homelab_internal:
    external: true
    name: traefik_internal


volumes:
  digital_asset_vault_pgdata: